<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KANA Spatial Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Cesium -->
  <link rel="stylesheet"
        href="https://fastly.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css?v=KANAv1" />
  <script src="https://fastly.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js?v=KANAv1"></script>

  <!-- Your CSS -->
  <link rel="stylesheet" href="./styles.css?v=KANAv1" />
</head>

<body>
  <header class="app-header">
    <div class="title">KANA Spatial Intelligence</div>
    <div class="subtitle">MOCK DEMO · No PHI · Admin approval required</div>
    <div class="build">BUILD: KANAv1</div>
  </header>

  <div class="scope-controls">
    <button onclick="window.kanaFlyScope && window.kanaFlyScope('kodiak')">Kodiak</button>
    <button onclick="window.kanaFlyScope && window.kanaFlyScope('archipelago')">Archipelago</button>
    <button onclick="window.kanaFlyScope && window.kanaFlyScope('anchorage')">Anchorage</button>
    <button onclick="window.kanaFlyScope && window.kanaFlyScope('all')">All Network</button>
  </div>

  <div id="map"></div>
  <div id="infoPanel" class="info-panel hidden"></div>
  <div id="errorOverlay" class="error-overlay hidden"></div>

  <script>
    // Visible error overlay helper
    const err = document.getElementById("errorOverlay");
    function showError(msg) {
      err.textContent = msg;
      err.classList.remove("hidden");
      console.error(msg);
    }

    // Verify Cesium loaded (otherwise nothing else matters)
    if (!window.Cesium) {
      showError(
        "Cesium failed to load.\n\n" +
        "This usually means your network blocked fastly.jsdelivr.net\n" +
        "or the CDN is having issues.\n\n" +
        "Next step: I can swap the Cesium CDN host."
      );
    }
  </script>

  <!-- IMPORTANT: real script tag with closing tag, and correct path -->
  <script
    src="./js/app.js?v=KANAv1"
    defer
    onload="window.__KANA_APP_LOADED__=true"
    onerror="document.getElementById('errorOverlay').textContent='Failed to load ./js/app.js (404 or blocked). Check that js/app.js exists in the repo and the filename is exactly app.js (case-sensitive).'; document.getElementById('errorOverlay').classList.remove('hidden');"
  ></script>

  <script>
    // If app.js never executed, we will tell you clearly
    setTimeout(() => {
      if (!window.__KANA_APP_LOADED__) {
        const msg =
          "app.js did not execute.\n\n" +
          "This is almost always ONE of these:\n" +
          "1) index.html had malformed <script> tags (now fixed)\n" +
          "2) js/app.js does not exist at that exact path\n" +
          "3) filename case mismatch (App.js vs app.js)\n\n" +
          "Open DevTools → Network tab and confirm ./js/app.js returns 200.";
        document.getElementById("errorOverlay").textContent = msg;
        document.getElementById("errorOverlay").classList.remove("hidden");
      }
    }, 1200);
  </script>
</body>
</html>
