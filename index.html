<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KANA Spatial Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Cesium (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="title">KANA Spatial Intelligence</div>
    <div class="subtitle">MOCK DEMO · No PHI · Admin approval required before publishing</div>
  </header>

  <div class="scope-controls">
    <button onclick="window.kanaFlyScope('kodiak')">Kodiak</button>

  </div>

  <div id="map"></div>

  <div id="infoPanel" class="info-panel hidden"></div>

  <!-- On-screen error overlay (so we never “black screen” silently again) -->
  <div id="errorOverlay" class="error-overlay hidden"></div>

  <script src="./app.js"></script>
